---
Hardware_Testbed:                
  data:                  
    ndtwin_kernel: "http://10.10.10.250:8000"
    recycle_interval: 10  # in seconds
    sleep_time: # sleep time between flow generation requests
      min: 0.4
      max: 1.3
    ports_limitation: # used port range and excluded ports for flow generation
      min_port: 5204
      max_port: 10204
      exclude_ports:
        - 8000
    log_level: "INFO"  # TRACE, DEBUG, INFO, WARNING, ERROR
    tcp_socket_write_length: "1K"  # in bytes, not including header, only payload, can use K for 1024 bytes, M for 1024*1024 bytes, etc.
    udp_packet_length: "1460"  # in bytes, not including header, only payload, can use K for 1024 bytes, M for 1024*1024 bytes, etc.

